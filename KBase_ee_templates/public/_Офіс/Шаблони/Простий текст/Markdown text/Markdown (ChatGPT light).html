<style>
.divMain_{[templateId]} {
    margin: 7px;
    padding: 2px;
    border: 0px solid black;
}
.aTitle_{[templateId]} {
    font-weight: bold;
    color: rgb(40,40,140);
    margin: 0px;
    padding: 0px;
}

/* Header container with flex alignment for Title and Copy button */
.header-row_{[templateId]} {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding: 2px 0;
}
.header-title-container_{[templateId]} {
    flex-grow: 1;
}

/* ChatGPT style copy button */
.btn-copy_{[templateId]} {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    font-family: inherit;
    color: #6e6e80;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    margin-left: auto;
}
.btn-copy_{[templateId]}:hover {
    background: #f4f4f5;
    color: #0d0d0d;
    border-color: #d1d1d6;
}
.btn-copy_{[templateId]}:active {
    background: #e4e4e7;
}
.btn-copy_{[templateId]} svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
}
.btn-copy_{[templateId]}.copied {
    color: #10a37f;
    border-color: #10a37f;
    background: #f0fdf4;
}

/* === Markdown ChatGPT light theme === */
.md-body_{[templateId]} {
    font-family: 'Söhne', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif;
    font-size: 16px;
    line-height: 1.75;
    color: #0d0d0d;
    background: #ffffff;
    padding: 4px 6px;
    max-width: 100%;
    word-break: break-word;
}

/* Headings */
.md-body_{[templateId]} h1,
.md-body_{[templateId]} h2,
.md-body_{[templateId]} h3,
.md-body_{[templateId]} h4,
.md-body_{[templateId]} h5,
.md-body_{[templateId]} h6 {
    font-weight: 600;
    line-height: 1.3;
    margin-top: 1.1em;
    margin-bottom: 0.4em;
    color: #0d0d0d;
}
.md-body_{[templateId]} h1 { font-size: 1.65em; border-bottom: 1px solid #e5e5e5; padding-bottom: 0.2em; }
.md-body_{[templateId]} h2 { font-size: 1.35em; border-bottom: 1px solid #e5e5e5; padding-bottom: 0.15em; }
.md-body_{[templateId]} h3 { font-size: 1.15em; }
.md-body_{[templateId]} h4 { font-size: 1.02em; }
.md-body_{[templateId]} h5 { font-size: 0.95em; }
.md-body_{[templateId]} h6 { font-size: 0.9em;  color: #6e6e80; }

/* Paragraphs */
.md-body_{[templateId]} p {
    margin: 0 0 0.85em 0;
}

/* Links */
.md-body_{[templateId]} a {
    color: #0066cc;
    text-decoration: underline;
}
.md-body_{[templateId]} a:hover {
    color: #0044aa;
}

/* Bold & Italic */
.md-body_{[templateId]} strong { font-weight: 700; }
.md-body_{[templateId]} em     { font-style: italic; }

/* Strikethrough */
.md-body_{[templateId]} del {
    text-decoration: line-through;
    color: #6e6e80;
}

/* Inline code */
.md-body_{[templateId]} code {
    font-family: 'Söhne Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    font-size: 0.875em;
    background: #f2f2f2;
    color: #c7254e;
    border-radius: 4px;
    padding: 0.18em 0.38em;
    border: 1px solid #e8e8e8;
}

/* Code blocks */
.md-body_{[templateId]} pre {
    background: #f7f7f8;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0.9em 0;
    font-size: 0.875em;
    line-height: 1.55;
    position: relative;
}
.md-body_{[templateId]} pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
    border-radius: 0;
    color: inherit;
}

/* === Highlight.js Syntax Highlighting (ChatGPT Light / GitHub theme) === */
.md-body_{[templateId]} .hljs {
    color: #24292e;
    background: transparent;
}
.md-body_{[templateId]} .hljs-comment,
.md-body_{[templateId]} .hljs-quote {
    color: #6a737d;
    font-style: italic;
}
.md-body_{[templateId]} .hljs-keyword,
.md-body_{[templateId]} .hljs-selector-tag,
.md-body_{[templateId]} .hljs-subst {
    color: #d73a49;
    font-weight: 600;
}
.md-body_{[templateId]} .hljs-number,
.md-body_{[templateId]} .hljs-literal,
.md-body_{[templateId]} .hljs-variable,
.md-body_{[templateId]} .hljs-template-variable,
.md-body_{[templateId]} .hljs-tag .hljs-attr {
    color: #005cc5;
}
.md-body_{[templateId]} .hljs-string,
.md-body_{[templateId]} .hljs-doctag,
.md-body_{[templateId]} .hljs-regexp {
    color: #032f62;
}
.md-body_{[templateId]} .hljs-title,
.md-body_{[templateId]} .hljs-section,
.md-body_{[templateId]} .hljs-selector-id {
    color: #6f42c1;
    font-weight: 600;
}
.md-body_{[templateId]} .hljs-title.class_,
.md-body_{[templateId]} .hljs-title.function_,
.md-body_{[templateId]} .hljs-type,
.md-body_{[templateId]} .hljs-class .hljs-title {
    color: #6f42c1;
}
.md-body_{[templateId]} .hljs-symbol,
.md-body_{[templateId]} .hljs-bullet,
.md-body_{[templateId]} .hljs-attribute,
.md-body_{[templateId]} .hljs-link {
    color: #005cc5;
}
.md-body_{[templateId]} .hljs-name,
.md-body_{[templateId]} .hljs-tag {
    color: #22863a;
}
.md-body_{[templateId]} .hljs-meta,
.md-body_{[templateId]} .hljs-meta .hljs-keyword {
    color: #e36209;
}
.md-body_{[templateId]} .hljs-built_in {
    color: #e36209;
}
.md-body_{[templateId]} .hljs-emphasis {
    font-style: italic;
}
.md-body_{[templateId]} .hljs-strong {
    font-weight: bold;
}

/* Blockquotes */
.md-body_{[templateId]} blockquote {
    border-left: 4px solid #d0d0d0;
    background: #f9f9fa;
    margin: 0.85em 0;
    padding: 0.55em 1em;
    color: #555;
    border-radius: 0 6px 6px 0;
    font-style: italic;
}
.md-body_{[templateId]} blockquote p {
    margin: 0;
}

/* Horizontal rule */
.md-body_{[templateId]} hr {
    border: none;
    border-top: 1px solid #e5e5e5;
    margin: 1.2em 0;
}

/* Lists */
.md-body_{[templateId]} ul,
.md-body_{[templateId]} ol {
    padding-left: 1.7em;
    margin: 0.5em 0 0.85em 0;
}
.md-body_{[templateId]} li {
    margin-bottom: 0.25em;
    line-height: 1.7;
}
.md-body_{[templateId]} li p {
    margin: 0;
}

/* Task lists (GFM) */
.md-body_{[templateId]} ul.task-list {
    list-style: none;
    padding-left: 0.3em;
}
.md-body_{[templateId]} .task-list-item {
    display: flex;
    align-items: flex-start;
    gap: 0.5em;
}
.md-body_{[templateId]} .task-list-item input[type="checkbox"] {
    margin-top: 0.28em;
    cursor: default;
    width: 15px;
    height: 15px;
    accent-color: #10a37f;
    flex-shrink: 0;
}

/* Tables */
.md-body_{[templateId]} table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.85em 0;
    font-size: 0.95em;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e5e5e5;
}
.md-body_{[templateId]} thead {
    background: #f2f2f3;
}
.md-body_{[templateId]} th {
    font-weight: 600;
    text-align: left;
    padding: 9px 14px;
    border: 1px solid #e5e5e5;
    color: #0d0d0d;
}
.md-body_{[templateId]} td {
    padding: 8px 14px;
    border: 1px solid #e5e5e5;
    vertical-align: top;
}
.md-body_{[templateId]} tbody tr:nth-child(even) {
    background: #fafafa;
}
.md-body_{[templateId]} tbody tr:hover {
    background: #f0f0f0;
}

/* Images */
.md-body_{[templateId]} img {
    max-width: 100%;
    border-radius: 6px;
    margin: 0.5em 0;
    display: block;
}
</style>

<!--BODY_BEGIN {[InfoBlockId]}-->
<div class="divMain_{[templateId]}">

<div class="header-row_{[templateId]}">
    <div class="header-title-container_{[templateId]}">
        <SCRIPT type="text/javascript">
        var v_isShowDescr = {[isShowDescr]};
        var v_InfoDescr = "{[InfoDescr]}";

        if (v_isShowDescr == 1) {
            document.write("<a id='{[InfoBlockId]}' class='aTitle_{[templateId]}'>" + v_InfoDescr + "</a>");
        } else {
            document.write("<a id='{[InfoBlockId]}'></a>");
        }
        </SCRIPT>
    </div>

    <!-- ChatGPT Style Copy Button -->
    <button type="button" class="btn-copy_{[templateId]}" onclick="copyMdContent_{[templateId]}('{[InfoBlockId]}', this)" title="Копіювати текст">
        <span class="btn-icon_{[templateId]}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </span>
        <span class="btn-text_{[templateId]}">Копіювати</span>
    </button>
</div>

<!-- Raw MD source (hidden) - must be before the script that reads it -->
<script id="md-raw-{[InfoBlockId]}" type="text/plain" style="display:none">{[kbase_Info_Text]}</script>

<div id="md-body-{[InfoBlockId]}" class="md-body_{[templateId]}"></div>
<script type="text/javascript">
function copyMdContent_{[templateId]}(infoBlockId, btn) {
    var rawText = document.getElementById('md-raw-' + infoBlockId).textContent;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(rawText);
    } else {
        var textArea = document.createElement("textarea");
        textArea.value = rawText;
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(textArea);
    }

    btn.classList.add('copied');
    var iconSpan = btn.querySelector('.btn-icon_{[templateId]}');
    var textSpan = btn.querySelector('.btn-text_{[templateId]}');

    if (textSpan) textSpan.textContent = 'Скопійовано!';
    if (iconSpan) {
        iconSpan.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    }

    setTimeout(function() {
        btn.classList.remove('copied');
        if (textSpan) textSpan.textContent = 'Копіювати';
        if (iconSpan) {
            iconSpan.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
        }
    }, 2000);
}

(function() {
    var rawMd = document.getElementById('md-raw-{[InfoBlockId]}').textContent;
    var html = marked.parse(rawMd, {
        gfm: true,
        breaks: true
    });
    var targetDiv = document.getElementById('md-body-{[InfoBlockId]}');
    targetDiv.innerHTML = html;

    /* Task list fix: marked renders <ul> with class="contains-task-list", items with class="task-list-item" */
    var taskLists = targetDiv.querySelectorAll('ul.contains-task-list');
    taskLists.forEach(function(ul) {
        ul.classList.add('task-list');
    });

    /* Highlight code blocks inside the rendered markdown */
    if (typeof hljs !== 'undefined') {
        var codeBlocks = targetDiv.querySelectorAll('pre code');
        codeBlocks.forEach(function(block) {
            hljs.highlightElement(block);
        });
    }
})();
</script>

</div>
<!--BODY_END-->
