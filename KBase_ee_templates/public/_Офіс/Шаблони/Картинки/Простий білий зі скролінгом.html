<!--HEAD_BEGIN css_{[templateId]}-->
<style>
.divMain_{[templateId]} {
    margin: 7px; /* Значение отступов */
    padding: 2px; /* Поля вокруг текста */
    padding-bottom: 15px;
    border: 0px solid black; /* Параметры границы */
    overflow-x:auto;
}
.aTitle_{[templateId]} {
	font-weight: bold;
    color: rgb(40,40,140);
    margin: 0px; /* Значение отступов */
    padding: 0px; /* Поля вокруг текста */
}
.aDescr_{[templateId]} {
    color: rgb(133,123,207);
	margin: 0px; /* Значение отступов */
	padding: 0px; /* Поля вокруг текста */
}
.pre_{[templateId]} {
	color : #000000;
    white-space: pre-wrap;       /* CSS 3 */
    white-space: -moz-pre-wrap;  /* Mozilla, since 1999 */
    white-space: -pre-wrap;      /* Opera 4-6 */
    white-space: -o-pre-wrap;    /* Opera 7 */
    word-wrap: break-word;       /* Internet Explorer 5.5+ */
    padding: 0px; 
    margin: 0px;
}
</style>
<!--HEAD_END css_{[templateId]}-->

<!--BODY_BEGIN {[InfoBlockId]}-->
<div class="divMain_{[templateId]}">

<SCRIPT type="text/javascript">
var v_InfoImageTitle = "{[InfoImageTitle]}";
var v_InfoImagePath = "{[InfoImagePath]}";
var v_InfoImageWidth = {[InfoImageWidth]};
var v_InfoImageHeight = {[InfoImageHeight]};
var v_InfoImageDescr = "{[InfoImageDescr]}";
var v_isShowTitle = {[isShowTitle]};
var v_isShowDescr = {[isShowDescr]};
//var v_isShowText = {[isShowText]};

var s_InfoImageWidth  = (v_InfoImageWidth  > 0) ? " width='"+v_InfoImageWidth+"' " : "";
var s_InfoImageHeight = (v_InfoImageHeight > 0) ? " height='"+v_InfoImageHeight+"' " : "";

if (v_isShowTitle == 1) {
	document.write("<a id='{[InfoBlockId]}' class='aTitle_{[templateId]}'>" + v_InfoImageTitle + "</a>");
	document.write("<br>");
} else {
	document.write("<a id='{[InfoBlockId]}'></a>");
}

document.write("<img "+ s_InfoImageWidth + s_InfoImageHeight +" src='" + v_InfoImagePath + "'>");
document.write("<br>");

if (v_isShowDescr == 1) {
	document.write("<a class='aDescr_{[templateId]}'>" + v_InfoImageDescr + "</a>");
	document.write("<br>");
}
</SCRIPT>

<pre id="pre_{[InfoBlockId]}" class="pre_{[templateId]}">{[InfoImageText]}</pre>

</div>
<!--BODY_END-->
